<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky & Desert Gradient -->
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="45%" stop-color="#e2ba80"/>
      <stop offset="100%" stop-color="#5a3318"/>
    </radialGradient>

    <!-- Warm Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#24140a" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Standardized Brick Texture Pattern -->
    <pattern id="brickPattern" width="70" height="35" patternUnits="userSpaceOnUse">
      <rect width="70" height="35" fill="none" stroke="#3b2416" stroke-width="1.2" stroke-opacity="0.12"/>
      <line x1="35" y1="0" x2="35" y2="35" stroke="#3b2416" stroke-width="1.2" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Ancient Sun / Halo -->
  <circle cx="960" cy="380" r="280" fill="#fff5de" opacity="0.35"/>

  <!-- Distant Dunes -->
  <path d="M0 650 Q 480 570 960 640 T 1920 630 L 1920 1080 L 0 1080 Z" fill="#b07d46" opacity="0.45"/>
  <path d="M0 720 Q 520 660 1100 730 T 1920 700 L 1920 1080 L 0 1080 Z" fill="#8c5828" opacity="0.55"/>

  <!-- Mohenjo-daro / Harappa Citadel & Granary Silhouettes -->
  <g fill="#452713" opacity="0.8">
    <!-- Watchtower / Stupa Mound Structure -->
    <rect x="860" y="520" width="200" height="150" rx="4"/>
    <rect x="895" y="460" width="130" height="60" rx="3"/>
    <rect x="930" y="420" width="60" height="40" rx="2"/>

    <!-- Fortified Terraces Left -->
    <rect x="220" y="600" width="380" height="240" rx="4"/>
    <rect x="300" y="550" width="220" height="50"/>
    <rect x="360" y="510" width="100" height="40"/>

    <!-- Fortified Terraces Right -->
    <rect x="1320" y="590" width="400" height="250" rx="4"/>
    <rect x="1400" y="530" width="240" height="60"/>
    <rect x="1470" y="490" width="100" height="40"/>
  </g>

  <!-- Foreground City Mound Platform -->
  <path d="M-50 820 L 450 790 L 960 830 L 1500 780 L 1970 820 L 1970 1080 L -50 1080 Z" fill="#30190c"/>

  <!-- Brick Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#brickPattern)"/>

  <!-- Dark Edge Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
